name: Release static web bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: tar -czf "music-trainer-${GITHUB_REF_NAME}.tar.gz" -C apps/web/dist .
      - run: gh release create "$GITHUB_REF_NAME" "music-trainer-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Deploy release bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
